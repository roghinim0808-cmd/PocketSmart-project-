{% extends 'base.html' %}{% block title %}History · PocketSmart AI{% endblock %}
{% block content %}<section class="page-head"><p class="eyebrow">HISTORY</p><h1>Your recommendation history</h1><p>Open a saved plan to review its recommendations.</p></section><div id="historyList" class="history-list"></div>{% endblock %}
{% block scripts %}<script>async function loadHistory(){const r=await api('/api/history'); if(!r.ok){location.href='/login';return;} const el=document.getElementById('historyList'); if(!r.data.length){el.innerHTML='<div class="empty">No recommendations yet. Create your first plan.</div>';return;} el.innerHTML=r.data.map(x=>`<a class="history-item" href="#" onclick="openRecommendation(${x.id});return false;"><div><b>${x.planner_type.toUpperCase()} PLAN</b><p>${escapeHtml(x.summary)}</p></div><strong>₹${Number(x.budget).toLocaleString('en-IN')}</strong></a>`).join('');} async function openRecommendation(id){const r=await api('/api/recommendations-details/'+id); if(r.ok) alert(r.data.summary+'\n\nRecommendations: '+r.data.recommendations.map(x=>x.name+' - ₹'+x.price).join(', '));} loadHistory();</script>{% endblock %}
