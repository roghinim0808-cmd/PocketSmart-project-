{% extends 'base.html' %}{% block title %}Login · PocketSmart AI{% endblock %}
{% block content %}<div class="auth-wrap"><form class="form-card" id="loginForm"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn primary full" type="submit">Login</button><div id="formMessage" class="message"></div><p class="small">No account? <a href="/register">Create one</a></p></form></div>{% endblock %}
{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit', async e=>{e.preventDefault(); const data=Object.fromEntries(new FormData(e.target)); const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify(data)}); if(r.ok) location.href='/dashboard'; else showMessage(r.data.detail||'Login failed',true);});</script>{% endblock %}
