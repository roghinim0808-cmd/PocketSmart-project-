{% extends 'base.html' %}{% block title %}Party Planner · PocketSmart AI{% endblock %}
{% block content %}<section class="page-head"><p class="eyebrow">PARTY PLANNER</p><h1>Plan the event budget</h1><p>Set guests, event type and venue preference.</p></section><div class="planner-grid"><form class="form-card" id="plannerForm"><label>Total budget (₹)<input type="number" name="budget" min="1" required placeholder="30000"></label><label>Guest count<input type="number" name="guest_count" min="1" required placeholder="30"></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family Function</option><option>Other</option></select></label><label>Venue preference<select name="venue"><option>Flexible</option><option>Home</option><option>Banquet Hall</option><option>Outdoor</option></select></label><label>Notes<textarea name="notes" placeholder="Food preference, theme, etc."></textarea></label><button class="btn primary full">Generate plan</button></form><div id="result" class="result-card"><div class="empty">Your recommendations will appear here.</div></div></div>{% endblock %}
{% block scripts %}<script>document.getElementById('plannerForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const body={budget:Number(fd.get('budget')),guest_count:Number(fd.get('guest_count')),event_type:fd.get('event_type'),venue:fd.get('venue'),notes:fd.get('notes')};renderLoading();const r=await api('/api/generate-party',{method:'POST',body:JSON.stringify(body)});renderResult(r);});</script>{% endblock %}
