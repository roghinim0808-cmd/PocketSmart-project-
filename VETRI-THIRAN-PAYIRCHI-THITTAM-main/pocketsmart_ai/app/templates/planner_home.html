{% extends 'base.html' %}{% block title %}Home Planner · PocketSmart AI{% endblock %}
{% block content %}<section class="page-head"><p class="eyebrow">HOME INTERIOR</p><h1>Build a home plan</h1><p>Tell PocketSmart AI your budget, rooms and preferred style.</p></section><div class="planner-grid"><form class="form-card" id="plannerForm"><label>Total budget (₹)<input type="number" name="budget" min="1" required placeholder="50000"></label><fieldset><legend>Rooms</legend><label class="check"><input type="checkbox" name="rooms" value="Living Room" checked> Living Room</label><label class="check"><input type="checkbox" name="rooms" value="Bedroom"> Bedroom</label><label class="check"><input type="checkbox" name="rooms" value="Kitchen"> Kitchen</label><label class="check"><input type="checkbox" name="rooms" value="Dining Area"> Dining Area</label></fieldset><label>Style<select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Boho</option></select></label><label>Notes<textarea name="notes" placeholder="Any special requirements?"></textarea></label><button class="btn primary full">Generate plan</button></form><div id="result" class="result-card"><div class="empty">Your recommendations will appear here.</div></div></div>{% endblock %}
{% block scripts %}<script>document.getElementById('plannerForm').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const rooms=fd.getAll('rooms');if(!rooms.length){showMessage('Select at least one room',true);return;}const body={budget:Number(fd.get('budget')),rooms,style:fd.get('style'),notes:fd.get('notes')};renderLoading();const r=await api('/api/generate-home',{method:'POST',body:JSON.stringify(body)});renderResult(r);});</script>{% endblock %}
