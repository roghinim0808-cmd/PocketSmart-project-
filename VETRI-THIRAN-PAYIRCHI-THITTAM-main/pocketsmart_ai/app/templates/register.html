{% extends 'base.html' %}{% block title %}Register · PocketSmart AI{% endblock %}
{% block content %}<div class="auth-wrap"><form class="form-card" id="registerForm"><p class="eyebrow">CREATE ACCOUNT</p><h1>Start planning</h1><label>Name<input type="text" name="name" minlength="2" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button class="btn primary full" type="submit">Create account</button><div id="formMessage" class="message"></div><p class="small">Already registered? <a href="/login">Login</a></p></form></div>{% endblock %}
{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit', async e=>{e.preventDefault(); const data=Object.fromEntries(new FormData(e.target)); const r=await api('/api/auth/register',{method:'POST',body:JSON.stringify(data)}); if(r.ok) location.href='/dashboard'; else showMessage(r.data.detail||'Registration failed',true);});</script>{% endblock %}
